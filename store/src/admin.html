<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.admin.title"></title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="admin">
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="Zahran AI Studio">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2" y="5" width="28" height="22" rx="5" stroke="#f5c25b" stroke-width="2"/>
        <path d="M13 11.5v9l7.5-4.5L13 11.5Z" fill="#f5c25b"/>
        <path d="M2 9.5h28M2 22.5h28" stroke="#f5c25b" stroke-opacity=".35" stroke-width="1.5"/>
      </svg>
      <span data-i18n="brand"></span>
    </a>
    <div class="tools">
      <button type="button" class="lang-toggle" id="lang-toggle"></button>
      <button type="button" class="btn btn-ghost" id="signout-btn" hidden data-i18n="admin.signout"></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <!-- تسجيل الدخول (Supabase Auth) -->
    <section class="admin-login" id="login-view" aria-labelledby="login-title">
      <h1 id="login-title" style="font-size:1.6rem" data-i18n="admin.signin"></h1>
      <p class="muted" data-i18n="admin.signin.hint"></p>
      <form id="login-form" class="stack-sm" novalidate>
        <div class="field">
          <label for="a-email" data-i18n="admin.email"></label>
          <input id="a-email" type="email" dir="ltr" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="a-pass" data-i18n="admin.password"></label>
          <input id="a-pass" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <p class="form-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn" data-i18n="admin.signin.btn"></button>
      </form>
    </section>

    <!-- لوحة الطلبات -->
    <section id="dash-view" hidden>
      <div class="admin-head">
        <h1 data-i18n="admin.title"></h1>
        <div class="contact-actions">
          <button type="button" class="btn btn-ghost" id="refresh-btn" data-i18n="admin.refresh"></button>
          <button type="button" class="btn btn-ghost" id="export-btn" data-i18n="admin.export"></button>
        </div>
      </div>

      <div class="kpis" id="kpis">
        <div class="kpi"><span data-i18n="admin.kpi.orders"></span><strong id="k-orders">0</strong></div>
        <div class="kpi" data-t="paid"><span data-i18n="admin.kpi.revenue"></span><strong id="k-revenue">0</strong></div>
        <div class="kpi" data-t="wait"><span data-i18n="admin.kpi.waiting"></span><strong id="k-waiting">0</strong></div>
        <div class="kpi" data-t="prod"><span data-i18n="admin.kpi.production"></span><strong id="k-prod">0</strong></div>
      </div>

      <div class="toolbar">
        <div class="field">
          <label class="visually-hidden" for="q" data-i18n="admin.search"></label>
          <input id="q" type="search" data-i18n-placeholder="admin.search">
        </div>
        <div class="field small">
          <label class="visually-hidden" for="status-filter" data-i18n="admin.status"></label>
          <select id="status-filter"></select>
        </div>
      </div>

      <p class="form-error" id="dash-error" role="alert"></p>

      <div class="table-wrap" id="table-wrap">
        <table class="orders">
          <thead>
            <tr>
              <th scope="col" data-i18n="admin.col.order"></th>
              <th scope="col" data-i18n="admin.col.date"></th>
              <th scope="col" data-i18n="admin.col.customer"></th>
              <th scope="col" data-i18n="admin.col.items"></th>
              <th scope="col" data-i18n="admin.col.total"></th>
              <th scope="col" data-i18n="admin.col.status"></th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
      <div class="state" id="orders-empty" hidden>
        <h3 data-i18n="admin.empty.title"></h3>
        <p data-i18n="admin.empty.text"></p>
      </div>
    </section>
  </div>
</main>

<dialog class="dialog" id="order-dialog" aria-labelledby="od-title">
  <div class="dialog-head">
    <h2 id="od-title" style="font-size:1.3rem"></h2>
    <button type="button" class="icon-btn" id="od-close" data-i18n-aria="cart.close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="dialog-body">
    <dl class="kv" id="od-kv"></dl>
    <div>
      <h3 style="font-size:1.05rem;margin-bottom:8px" data-i18n="admin.items"></h3>
      <ul class="items-list" id="od-items"></ul>
    </div>
    <div class="field">
      <label for="od-status" data-i18n="admin.status"></label>
      <select id="od-status"></select>
    </div>
    <div class="field">
      <label for="od-notes" data-i18n="admin.notes"></label>
      <textarea id="od-notes" maxlength="2000"></textarea>
    </div>
    <p class="form-error" id="od-error" role="alert"></p>
  </div>
  <div class="dialog-foot">
    <a class="btn btn-ghost" id="od-wa" target="_blank" rel="noopener noreferrer" data-i18n="admin.whatsapp"></a>
    <button type="button" class="btn btn-primary" id="od-save" data-i18n="admin.save"></button>
  </div>
</dialog>

<!--@include footer-->
<div class="toast-region" id="toasts" aria-live="polite"></div>

<script src="/js/config.js"></script>
<script src="/vendor/supabase.js" defer></script>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
